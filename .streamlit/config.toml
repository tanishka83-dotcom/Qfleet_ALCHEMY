[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#0a1428"
secondaryBackgroundColor = "#0f1f3d"
textColor = "#f1f5f9"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
